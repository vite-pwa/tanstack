autoInstallPeers: true

catalogMode: prefer

dedupePeers: true

ignoreWorkspaceRootCheck: true

linkWorkspacePackages: true

verifyDepsBeforeRun: install

preferWorkspacePackages: true

shamefullyHoist: true

shellEmulator: true

strictPeerDependencies: false

trustPolicy: no-downgrade

packages:
  - examples/**

overrides:
  '@types/node': 'catalog:types'
  chokidar: ^5.0.0
  sharp: ^0.35.5
  semver: ^7.8.5
  why-is-node-running: 'catalog:utils'

allowBuilds:
  '@parcel/watcher': false
  core-js: false
  esbuild: false
  sharp: true

catalogs:
  build:
    tsdown: ^0.23.1
  eslint:
    '@antfu/eslint-config': ^10.0.0
    eslint: ^10.13.0
    eslint-plugin-antfu: ^3.2.3
  pwa:
    '@unplugin-pwa/core': ^0.0.3
    '@unplugin-pwa/inspector': ^0.0.3
    '@unplugin-pwa/vite': ^0.0.3
    '@vite-pwa/assets-generator': ^2.0.0
    '@vite-pwa/workbox-build': ^8.0.13
    '@vite-pwa/workbox-swkit': ^8.0.13
    '@vite-pwa/workbox-window': ^8.0.13
  tanstackreact:
    # deps
    '@tanstack/react-devtools': ^0.10.8
    '@tanstack/react-router': ^1.170.17
    '@tanstack/react-router-devtools': ^1.167.0
    '@tanstack/react-router-ssr-query': ^1.167.1
    '@tanstack/react-start': ^1.168.27
    '@tanstack/router-plugin': ^1.132.0
    lucide-react: ^0.545.0
    react: ^19.2.0
    react-dom: ^19.2.0
    tailwindcss: ^4.1.18
    # dev deps
    '@tailwindcss/typography': ^0.5.16
    '@tailwindcss/vite': ^4.2.2
    '@tanstack/devtools-vite': ^0.8.1
    '@tanstack/router-cli': ^1.132.0
    '@testing-library/dom': ^10.4.1
    '@testing-library/react': ^16.3.0
    '@types/react': ^19.2.0
    '@types/react-dom': ^19.2.0
    '@vitejs/plugin-react': ^6.0.1
    jsdom: ^28.1.0
  types:
    '@types/debug': ^4.1.13
    '@types/node': 24.19.2
  typescript:
    typescript: ~6.0.3
  utils:
    '@antfu/ni': ^25.0.0
    '@arethetypeswrong/core': ^0.18.5
    '@vitejs/devtools': ^0.7.6
    https-localhost: 4.7.2
    magicast: ^0.5.5
    nitro: ^3.0.261029-rc
    publint: ^0.3.25
    rolldown: ^1.2.14
    taze: 21.1.0
    vite: ^8.3.5
    vite-plugin-inspect: ^12.1.0
    why-is-node-running: 3.2.3

peerDependencyRules:
  ignoreMissing:
    - '@algolia/client-search'

minimumReleaseAgeExclude:
  - uppt
  - nitro
  - vite
  - '@unplugin-pwa/core'
  - '@unplugin-pwa/inspector'
  - '@unplugin-pwa/vite'
  - '@vite-pwa/workbox-build'
  - '@vite-pwa/workbox-swkit'
  - '@vite-pwa/workbox-window'

supportedArchitectures:
  os:
    - win32
    - darwin
    - current
  cpu:
    - x64
    - arm64
